[package]
name = "quetzal-api"
description = "REST API server for the Daedalus backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "quetzal"
path = "src/main.rs"

[[bin]]
name = "quetzal-conformance-adapter"
path = "src/bin/conformance.rs"

[dependencies]
base64 = { workspace = true }
quetzal-wallet = { path = "../quetzal-wallet" }
quetzal-primitives = { path = "../quetzal-primitives" }
quetzal-network = { path = "../quetzal-network" }
quetzal-address = { path = "../quetzal-address" }
quetzal-crypto = { path = "../quetzal-crypto" }
pallas-crypto = { workspace = true }
pallas-addresses = { workspace = true }
pallas-txbuilder = { workspace = true }
pallas-primitives = { workspace = true }
pallas-traverse = { workspace = true }
pallas-codec = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
bip39 = { workspace = true }
rand = { workspace = true }
bech32 = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
